services:
  - type: web
    name: hookingpoint-skill-server
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn skill_server:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ROUTER_MODEL
        value: gpt-4o-mini
      - key: GRADER_MODEL
        value: gpt-4o-mini
    healthCheckPath: /health
